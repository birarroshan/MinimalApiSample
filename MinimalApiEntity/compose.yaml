services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56380:6379"
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pizzas
      POSTGRES_USER: pizza_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    ports:
      - "127.0.0.1:55433:5432"
    secrets:
      - postgres_password
    volumes:
      - pizza_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pizza_app -d pizzas"]
      interval: 2s
      timeout: 5s
      retries: 30

secrets:
  postgres_password:
    file: ${PIZZA_POSTGRES_PASSWORD_FILE:?Run scripts\Start-Postgres.ps1 first}

volumes:
  pizza_postgres_data:
